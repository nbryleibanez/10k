[workspace]
members = [
  "crates/domain",
  "crates/usecases",
  "crates/adapters",
  "crates/infra",
  "crates/dto",
  "crates/handlers/log_session",
  "crates/handlers/health",
  "crates/api-spec"
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["10k Team"]
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
aws-config = "1.1"
aws-sdk-dynamodb = "1.12"
aws-smithy-types = "1.1"
chrono = { version = "0.4", features = ["serde"] }
lambda_runtime = "0.11"
lambda_http = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
ammonia = "3.3"
aws-sdk-eventbridge = "1.11"
utoipa = { version = "4.2", features = ["chrono"] }
